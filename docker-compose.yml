version: '3.8'

services:
  # PHP-FPM 8.3 for Symfony
  php-fpm:
    image: php:8.3-fpm
    container_name: ai_email_php_fpm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ai_email_network
    depends_on:
      - redis

  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: ai_email_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ai_email_network
    depends_on:
      - php-fpm

  # Redis for Symfony Messenger queue
  redis:
    image: redis:7-alpine
    container_name: ai_email_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_email_network
    command: redis-server --appendonly yes

  # n8n - Workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: ai_email_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai_email_network
    depends_on:
      - redis

  # Ollama - Local LLM (Llama 3.1 8B)
  ollama:
    image: ollama/ollama:latest
    container_name: ai_email_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_email_network
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Python helper for PDF stamping with PyMuPDF
  python-helper:
    image: python:3.12-slim
    container_name: ai_email_python
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./python:/app
      - ./storage:/app/storage
    command: tail -f /dev/null
    networks:
      - ai_email_network

  # Tesseract OCR
  tesseract:
    image: tesseractshadow/tesseract4re:latest
    container_name: ai_email_tesseract
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
    networks:
      - ai_email_network

networks:
  ai_email_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  n8n_data:
    driver: local
  ollama_data:
    driver: local
